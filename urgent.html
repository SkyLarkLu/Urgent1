<html lang="cs">

<meta charset="UTF-8">

<title>Ošetřovatelský zápis | Urgent</title>
<style>
:root {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: #f0f3f8;
  color: #192638;
}
header {
  background: #142d49;
  color: white;
  padding: 24px 18px;
}
header h1 { margin: 0 0 7px; font-size: 23px; }
header p { margin: 0; opacity: .8; font-size: 13px; }
main { max-width: 850px; margin: auto; padding: 14px; }
section {
  background: white;
  border-radius: 13px;
  margin-bottom: 12px;
  overflow: hidden;
  border: 1px solid #dce3ec;
}
summary {
  padding: 17px;
  font-weight: 700;
  cursor: pointer;
  background: #e5edf7;
  color: #183b63;
}
.content { padding: 16px; }
.field { margin-bottom: 20px; }
.field label.title {
  display: block;
  font-weight: 650;
  margin-bottom: 9px;
  font-size: 14px;
}
.options {
  display: grid;
  grid-template-columns: repeat(2,minmax(0,1fr));
  gap: 8px;
}
.choice {
  display: flex;
  align-items: center;
  gap: 8px;
  border: 1px solid #d8e0ea;
  border-radius: 8px;
  padding: 10px;
  font-size: 13px;
  cursor: pointer;
  min-height: 43px;
}
.choice:has(input:checked) {
  background: #e5f0ff;
  border-color: #3779c5;
}
input[type=checkbox], input[type=radio] {
  accent-color: #2367ad;
  width: 17px;
  height: 17px;
  flex-shrink: 0;
}
textarea, input[type=text], select {
  width: 100%;
  padding: 12px;
  border: 1px solid #c9d5e3;
  border-radius: 8px;
  font: inherit;
  font-size: 15px;
  background: white;
}
textarea { min-height: 65px; resize: vertical; }
.toolbar {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-bottom: 14px;
}
button {
  border: 0;
  border-radius: 9px;
  padding: 13px 16px;
  background: #235d99;
  color: white;
  font-weight: 650;
  cursor: pointer;
  font-size: 14px;
}
button.secondary { background: #dce7f3; color: #183b63; }
button.danger { background: #8c3744; }
button:active { opacity: .75; }
#output {
  background: #f7f9fc;
  white-space: pre-wrap;
  padding: 16px;
  line-height: 1.65;
  border-radius: 8px;
  border: 1px solid #d7e0ea;
  min-height: 120px;
  font-size: 14px;
}
#progress { font-size: 13px; margin-bottom: 12px; color: #506477; }
.notice { color: #66798d; font-size: 12px; line-height: 1.5; }
@media(max-width:430px) {
  .options { grid-template-columns: 1fr 1fr; }
  .choice { font-size: 12px; padding: 8px; }
}
@media print {
  header, .toolbar, #formArea, .notice, #progress { display:none!important; }
  body { background:white; }
  section { border:0; }
  #output { border:0; font-size:12pt; }
}
</style>
</head>
<body>
<header>
  <h1>Ošetřovatelský zápis</h1>
  <p>Urgentní příjem | Resuscitační a intenzivní péče</p>
</header>

<main>
  <section>
    <div class="content">
      <div class="field">
        <label class="title">Směna</label>
        <div class="options">
          <label class="choice">
            <input type="radio" name="shift" value="Denní"> Denní
          </label>
          <label class="choice">
            <input type="radio" name="shift" value="Noční" checked> Noční
          </label>
        </div>
      </div>
      <div id="progress"></div>
      <div class="toolbar">
        <button class="secondary" onclick="toggleAll(true)">Rozbalit vše</button>
        <button class="secondary" onclick="toggleAll(false)">Sbalit vše</button>
      </div>
    </div>
  </section>

  <div id="formArea"></div>

  <section>
    <div class="content">
      <h2>Automatický zápis</h2>
      <p class="notice">
        Text se generuje z vyplněných položek.
        Nevyplněné údaje se vynechávají.
      </p>
      <div id="output"></div>
      <div class="toolbar" style="margin-top:14px">
        <button onclick="copyReport()">Kopírovat zápis</button>
        <button onclick="saveText()">Uložit TXT</button>
        <button onclick="window.print()">Tisk / PDF</button>
        <button class="danger" onclick="clearForm()">Vymazat</button>
      </div>
      <p id="status" class="notice"></p>
    </div>
  </section>
  <p class="notice">
    Údaje se neodesílají na server. Před použitím v dokumentaci
    zkontrolujte správnost textu, jednotek, časů a klinických údajů.
  </p>
</main>

const data = {};
const fieldTypes = {};

function el(tag, cls, text) {
 const node = document.createElement(tag);
 if(cls) node.className = cls;
 if(text !== undefined) node.textContent = text;
 return node;
}

function buildForm() {
 const root = document.getElementById("formArea");
 root.replaceChildren();
 sections.forEach((section,index)=>{
  const details = el("section");
  const d = el("details");
  if(index===0) d.open=true;
  const summary = el("summary","",section.title);
  const content = el("div","content");
  d.append(summary,content);

  section.fields.forEach(([name,type,choices])=>{
   fieldTypes[name]=type;
   const wrap=el("div","field");
   wrap.appendChild(el("label","title",name));

   if(type==="text"){
    const area=el("textarea");
    area.placeholder="Doplň údaj...";
    area.addEventListener("input",()=>{
      data[name]=area.value.trim();
      updateReport();
    });
    wrap.appendChild(area);
   } else if(type==="one"){
    const select=el("select");
    select.appendChild(new Option("— Nevybráno —",""));
    choices.split("|").forEach(x=>select.appendChild(new Option(x,x)));
    select.addEventListener("change",()=>{
      data[name]=select.value;
      updateReport();
    });
    wrap.appendChild(select);
   } else {
    const options=el("div","options");
    data[name]=[];
    choices.split("|").forEach(option=>{
      const label=el("label","choice");
      const input=el("input");
      input.type="checkbox";
      input.addEventListener("change",()=>{
       if(input.checked){
        if(!data[name].includes(option)) data[name].push(option);
       } else {
        data[name]=data[name].filter(x=>x!==option);
       }
       updateReport();
      });
      label.append(input,document.createTextNode(option));
      options.appendChild(label);
    });
    wrap.appendChild(options);
   }
   content.appendChild(wrap);
  });
  details.appendChild(d);
  root.appendChild(details);
 });
 updateReport();
}

function get(name){
 const value=data[name];
 if(Array.isArray(value)) return value.join(", ");
 return value || "";
}

function has(name){return !!get(name).trim();}

function line(prefix,names,suffix="."){
 const values=names.filter(has).map(get);
 return values.length?prefix+values.join(", ")+suffix:"";
}

function gcs(){
 const keys=["GCS E","GCS V","GCS M"];
 if(!keys.some(has)) return "";
 const parts=keys.filter(has).map(k=>
  k.slice(-1)+get(k).split(" ")[0]
 );
 let result="GCS "+parts.join(" / ");
 const valid=keys.every(k=>has(k)&&/^[1-6](\s|$)/.test(get(k)));
 if(valid){
  const sum=keys.reduce((s,k)=>s+Number(get(k).split(" ")[0]),0);
  result+=" (celkem "+sum+")";
 }else{
  result+=" (celkové skóre nehodnotitelné nebo neúplné)";
 }
 return result+".";
}

function measurements(pairs){
 const found=pairs.filter(([key])=>has(key))
   .map(([key,label,unit])=>label+get(key)+unit);
 return found.length?"Naměřené hodnoty: "+found.join(", ")+".":"";
}

function generateReport(){
 const paragraphs=[];
 const add=(items)=>{
  const text=items.filter(Boolean).join(" ");
  if(text) paragraphs.push(text);
 };

 const reasons=sections[0].fields
  .filter(f=>f[0].startsWith("Důvod přijetí –"))
  .map(f=>f[0]);

 const arrival={
  "ZZS HMP":"posádkou ZZS HMP",
  "ZZS SČK":"posádkou ZZS SČK",
  "LZS":"leteckou záchrannou službou",
  "Jiné oddělení":"překladem z jiného oddělení",
  "Jiná nemocnice":"překladem z jiné nemocnice",
  "Samostatný příchod":"samostatně",
  "Jiná ZZS":"posádkou jiné ZZS",
  "Jiné":"jiným způsobem"
 };

 let intro="";
 if(has("Způsob přijetí")){
  intro="Pacient přijat "+(arrival[get("Způsob přijetí")]||get("Způsob přijetí"));
  if(has("Upřesnění transportu / odkud"))
   intro+=" ("+get("Upřesnění transportu / odkud")+")";
  if(has("Čas příjmu")) intro+=" v "+get("Čas příjmu");
  intro+=".";
 }

 const reasonValues=reasons.flatMap(k=>
  Array.isArray(data[k])?data[k]:[]
 );
 if(has("Jiný důvod / okolnosti přijetí"))
  reasonValues.push(get("Jiný důvod / okolnosti přijetí"));

 add([
  intro,
  !intro?line("Čas příjmu: ",["Čas příjmu"]):"",
  reasonValues.length?"Důvod přijetí: "+reasonValues.join(", ")+".":"",
  line("Stav při příjmu: ",["Stav při příjmu"]),
  line("Oběhově: ",["Oběhový stav"]),
  line("Na monitoru rytmus: ",["Srdeční rytmus"]),
  measurements([
   ["TK (mmHg)","TK "," mmHg"],
   ["MAP (mmHg)","MAP "," mmHg"],
   ["TF (/min)","TF ","/min"]
  ]),
  line("Kapilární návrat: ",["Kapilární návrat"]),
  line("Periferie: ",["Periferie"]),
  line("Oběhová podpora: ",["Vazopresory / inotropika"]),
  line("Dávkování: ",["Dávky oběhové podpory"])
 ]);

 add([
  line("Stav vědomí: ",["Vědomí"]),
  gcs(),
  line("RASS: ",["RASS"]),
  line("Zornice: ",["Zornice"]),
  line("Velikost zornic P/L: ",["Velikost zornic P/L (mm)"]),
  line("Neurologický nález: ",["Motorika a další nález"])
 ]);

 add([
  line("Dýchání: ",["Dýchání"]),
  line("Oxygenoterapie / ventilace: ",["Oxygenoterapie"]),
  line("Dýchací cesty: ",["Dýchací cesty"]),
  line("Režim UPV: ",["Režim UPV"]),
  measurements([
   ["Průtok O₂ (l/min)","O₂ "," l/min"],
   ["FiO₂ (%)","FiO₂ "," %"],
   ["PEEP (cmH₂O)","PEEP "," cmH₂O"],
   ["Vt (ml)","Vt "," ml"],
   ["DF (/min)","DF ","/min"],
   ["SpO₂ (%)","SpO₂ "," %"],
   ["EtCO₂ (mmHg / kPa)","EtCO₂ "," (jednotka dle zadání)"]
  ]),
  line("Auskultačně: ",["Auskultační nález"]),
  line("Sekrece z DC: ",["Sekrece z DC"])
 ]);

 add([
  line("Sedace: ",["Hloubka sedace"]),
  line("Sedativa: ",["Sedativa"]),
  line("Analgezie: ",["Analgetika"]),
  line("Myorelaxace: ",["Myorelaxancia"]),
  has("Bolest NRS")?
   "Bolest NRS: "+get("Bolest NRS")+
   (get("Bolest NRS")==="Nehodnotitelná"?".":"/10."):"",
  line("Dávkování a efekt: ",["Dávkování a účinek"])
 ]);

 add([
  line("Zavedené cévní vstupy: ",["Cévní vstupy"]),
  line("Lokalizace vstupů: ",["Lokalizace a velikost vstupů"]),
  line("Další invazivní zajištění: ",["Další invaze"]),
  line("Stav vstupů: ",["Stav vstupů"]),
  line("Provedená vyšetření: ",["Vyšetření"]),
  line("Významné nálezy: ",["Významné nálezy"]),
  line("Provedené odběry: ",["Provedené odběry"]),
  line("Laboratorní výsledky: ",["Významné laboratorní výsledky"])
 ]);

 add([
  line("Kožní nález: ",["Kožní nález"]),
  line("Břicho: ",["Břicho"]),
  line("Diuréza: ",["Diuréza"]),
  line("Množství a charakter moči: ",["Diuréza – množství a charakter"]),
  line("Stolice: ",["Stolice"]),
  line("Výživa: ",["Výživa"]),
  line("Ošetřovatelská péče: ",["Provedená péče"])
 ]);

 add([
  line("Podaná léčba: ",["Další léčba"]),
  line("Transfuzní přípravky: ",["Transfuzní přípravky"]),
  line("Počet a identifikace přípravků: ",["Počet a identifikace přípravků"]),
  line("Farmakoterapie: ",["Podané léky, dávky a časy"]),
  line("Další průběh: ",["Další průběh"]),
  line("Čas významné události: ",["Čas významné události"]),
  line("Rodina: ",["Informování rodiny"]),
  line("Osobní věci: ",["Osobní věci"]),
  line("Další záznam: ",["Další poznámky"])
 ]);

 const shift=document.querySelector('input[name="shift"]:checked').value;
 let result=shift+" směna:\n\n";
 result+=paragraphs.length?
   paragraphs.join("\n\n"):"Zatím nejsou vyplněny žádné údaje.";
 if(has("Jmenovka / podpis"))
  result+="\n\nZapsal/a: "+get("Jmenovka / podpis");
 return result;
}

function updateReport(){
 document.getElementById("output").textContent=generateReport();
 const keys=Object.keys(fieldTypes);
 const filled=keys.filter(has).length;
 document.getElementById("progress").textContent=
  "Vyplněno "+filled+" z "+keys.length+" polí";
}

function toggleAll(open){
 document.querySelectorAll("#formArea details").forEach(d=>d.open=open);
}

async function copyReport(){
 const text=generateReport();
 try {
  await navigator.clipboard.writeText(text);
  showStatus("Zápis zkopírován.");
 }catch(e){
  const area=document.createElement("textarea");
  area.value=text;
  document.body.appendChild(area);
  area.select();
  try {
   const success=document.execCommand("copy");
   showStatus(success?"Zápis zkopírován.":"Označ a zkopíruj text ručně.");
  }catch(err){
   showStatus("Kopírování není dostupné. Text lze označit ručně.");
  }
  area.remove();
 }
}

function saveText(){
 const blob=new Blob([generateReport()],{
  type:"text/plain;charset=utf-8"
 });
 const url=URL.createObjectURL(blob);
 const a=document.createElement("a");
 a.href=url;
 a.download="osetrovatelsky_zapis.txt";
 document.body.appendChild(a);
 a.click();
 a.remove();
 setTimeout(()=>URL.revokeObjectURL(url),1000);
 showStatus("Soubor TXT byl připraven ke stažení.");
}

function clearForm(){
 if(!confirm("Opravdu vymazat celý formulář?")) return;
 Object.keys(data).forEach(k=>delete data[k]);
 buildForm();
 showStatus("Formulář byl vymazán.");
}

function showStatus(message){
 document.getElementById("status").textContent=message;
}

document.querySelectorAll('input[name="shift"]').forEach(input=>
 input.addEventListener("change",updateReport)
);

buildForm();
</script>
